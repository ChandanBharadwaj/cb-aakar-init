[project]
name = "aakar-geometry"
version = "0.1.0"
description = "Aakar geometry service: template registry, CAD, exports, build pipeline, RabbitMQ worker (PLAN §7)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "aakar-inspect",
  "build123d>=0.13,<0.14",
  "trimesh>=4.4,<6",
  "numpy>=1.26,<3",
  "shapely>=2.0",
  "jsonschema>=4.21",
  "referencing>=0.35",
  "rfc3339-validator>=0.1.4",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "boto3>=1.34",
  "pika>=1.3",
  "networkx>=3.2",
  "lxml>=5.0",
]

[project.scripts]
aakar-geometry = "aakar_geometry.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.uv.sources]
aakar-inspect = { path = "../inspect", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aakar_geometry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
