[project]
name = "aakar-inspect"
version = "0.1.0"
description = "Aakar inspect service: printability report v1 and print estimate v1 (PLAN §7.9, §7.10)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "trimesh>=4.4,<6",
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "shapely>=2.0",
  "rtree>=1.1",
  "networkx>=3.2",
  "lxml>=5.0",
  "jsonschema>=4.21",
  "referencing>=0.35",
  "rfc3339-validator>=0.1.4",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
embree = ["embreex>=2.17"]

[project.scripts]
aakar-inspect = "aakar_inspect.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aakar_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
