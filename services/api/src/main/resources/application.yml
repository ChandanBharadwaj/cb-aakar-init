spring:
  application:
    name: aakar-api
  profiles:
    # Job dispatch to the geometry service: `direct` (HTTP, local dev) or `rabbit` (AMQP, compose/prod).
    default: direct
  datasource:
    url: ${AAKAR_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/aakar}
    username: ${AAKAR_DB_USER:aakar}
    password: ${AAKAR_DB_PASSWORD:aakar}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # QC photos are capped at 10 MB by the admin module (413 payload_too_large); the container limit sits above it.
      max-file-size: 12MB
      max-request-size: 13MB

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

aakar:
  # `local` (default) or `production`. In production the startup guard refuses every mock adapter below,
  # the exposed OTP dev code and the default JWT secret (ADR-0013).
  profile: ${AAKAR_PROFILE:local}
  geometry:
    url: ${AAKAR_GEOMETRY_URL:http://localhost:8081}
  api:
    public-url: ${AAKAR_API_PUBLIC_URL:http://localhost:8080}
  web:
    # The storefront; the mock gateway's pay_url points at {web.url}/checkout/pay/{paymentId}.
    url: ${AAKAR_WEB_URL:http://localhost:3000}
  cors:
    # Storefront (3000) and management portal (3100); `aakar.cors.allowed-origins` is still read as an alias.
    origins: ${AAKAR_CORS_ORIGINS:http://localhost:3000,http://localhost:3100}
  identity:
    # HS256 key, at least 32 characters. The default is a dev-only string.
    jwt-secret: ${AAKAR_JWT_SECRET:aakar-local-dev-secret-do-not-use-in-production-0123456789}
    token-ttl: ${AAKAR_TOKEN_TTL:7d}
    otp:
      sender: ${AAKAR_OTP_SENDER:mock}            # mock logs the code; a real SMS sender is a drop-in OtpSender
      expose-dev-code: ${AAKAR_OTP_EXPOSE_DEV_CODE:true}   # return the code as dev_code (never in production)
      ttl: 5m
      max-requests-per-window: 5
      window: 15m
      max-attempts: 5
  payments:
    gateway: ${AAKAR_PAYMENTS_GATEWAY:mock}       # mock | razorpay (later)
  shipping:
    carrier: ${AAKAR_SHIPPING_CARRIER:mock}       # mock | delhivery (later)
  messaging:
    sender: ${AAKAR_MESSAGING_SENDER:log}         # log | whatsapp (later)
  media:
    # Local asset directory for staff uploads (QC photos), served at {api.public-url}/media/{key}; S3 later.
    dir: ${AAKAR_MEDIA_DIR:./.aakar-media}
  admin:
    # Management API (ADR-0012). The seed owner studio@aakar.local is created on first start with this password;
    # the production guard refuses the default. Staff tokens are HS256 with the identity secret and typ=staff.
    seed-password: ${AAKAR_ADMIN_SEED_PASSWORD:aakar-studio}
    token-ttl: ${AAKAR_ADMIN_TOKEN_TTL:12h}
  # PLAN §7.10 · the SEED pricing policy (ADR-0008): V4__pricing_policies.sql inserted the first active row and
  # V9__families_hardware_uploads.sql the current one (2026-10-carriers) with the same values as below; from then on
  # the active policy lives in the pricing_policies table. Copied from packages/design-tokens/materials.json →
  # pricing_policy (MaterialsSeedTest fails on drift). Family keys are bracketed so Boot keeps the underscores.
  pricing:
    version: 2026-10-carriers
    machine-rate-paise-per-hour: 20000
    finishing-fee-paise:
      matte: 8000
      silk: 12000
    packaging-fee-paise: 0
    margin-pct: 0
    round-to-rupees-ending-in: 9
    shipping-flat-paise: 7900
    free-shipping-above-paise: 99900
    shipping-label: "Shipping · Delhivery, 4 days"
    # Applied to bought-in hardware unit costs (split rings, magnets, LED bases); placeholder until supplier quotes land.
    hardware-markup-pct: 30
    # Per-outcome rules keyed by family id: minimum subtotals and the raw-print setup (repair and orientation) fee.
    family-rules:
      "[keychain]":
        minimum-subtotal-paise: 24900
      "[fridge_magnet]":
        minimum-subtotal-paise: 29900
      "[ornament]":
        minimum-subtotal-paise: 34900
      "[nameplate]":
        minimum-subtotal-paise: 59900
      "[raw_print]":
        minimum-subtotal-paise: 34900
        setup-fee-paise: 9900

logging:
  level:
    studio.aakar: INFO
