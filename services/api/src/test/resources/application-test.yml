# Integration tests: real PostgreSQL (aakar_test), schema recreated by TestFlywayConfig on context start.
spring:
  datasource:
    url: ${AAKAR_TEST_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/aakar_test}
    username: ${AAKAR_TEST_DB_USER:${AAKAR_DB_USER:aakar}}
    password: ${AAKAR_TEST_DB_PASSWORD:${AAKAR_DB_PASSWORD:aakar}}
  flyway:
    # clean-on-validation-error was removed in Flyway 11 (Teams only); TestFlywayConfig cleans then migrates instead.
    clean-disabled: false
aakar:
  api:
    public-url: http://localhost:8080
  media:
    dir: build/test-media
    # Specs name uploads by the URL the geometry service fetches; a distinct origin makes that visible in tests.
    internal-base-url: http://api.internal:8080
  uploads:
    # File names mentioning these land in the review queue (TermsContentScanner).
    flag-terms: [marvel, "iron man"]
logging:
  level:
    studio.aakar: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.SseEmitter: DEBUG
