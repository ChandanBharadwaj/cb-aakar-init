openapi: 3.1.0
info:
  title: Aakar API
  version: 1.0.0-phase0
  description: |
    Storefront API served by `services/api` (Spring Boot). Phase 0 covers the vertical slice:
    catalog + materials, designs from a template (Shop and Remix-lite paths), parameter edits,
    job progress over SSE, printability and price per material.

    Create-from-prompt (`prompt` on POST /api/designs) is accepted by the schema but answered
    with 422 `not_yet_available` until the co-designer agent lands in Phase 2.

    Errors use RFC 9457 Problem Details (`application/problem+json`) with a stable `code`.

    **Identity (Phase 1, ADR-0013).** Signed-in customers send `Authorization: Bearer <access_token>`.
    Guests send `X-Aakar-Guest: <uuid>` (generated and stored by the browser). Designs and carts belong
    to whichever identity created them; `POST /api/auth/otp/verify` attaches the guest's designs and cart
    to the user. In the `local` profile the OTP mock returns the code in the response (`dev_code`).
    External providers (payments, shipping, messaging, OTP) are adapters with mock defaults; a mock
    payment is completed from the placeholder pay page through `POST /api/payments/{id}/mock/complete`.
servers:
  - url: http://localhost:8080
paths:
  /api/catalog/items:
    get:
      summary: List Shop items
      tags: [catalog]
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
  /api/catalog/items/{slug}:
    get:
      summary: Shop item by slug
      tags: [catalog]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Item, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogItem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/catalog/materials:
    get:
      summary: Digital materials with rendering presets and rates
      tags: [catalog]
      responses:
        '200':
          description: Materials
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Material' } }
  /api/catalog/shelves:
    get:
      summary: Shop shelves (catalog categories) in display order
      tags: [catalog]
      responses:
        '200':
          description: Shelves
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Shelf' } }
  /api/families:
    get:
      summary: Outcome categories (Avatars) that are available and have a live template
      description: |
        Feeds the Create picker ("Give your idea an Avatar"). Each family carries its consumer copy, size
        envelope, bought-in hardware, material rules and content slot (Chhaap), plus the live template
        descriptors of that family. The raw family (`kind: raw`, Swaroop) is included; Shop shelves never list it.
      tags: [families]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [carrier, object, raw, hybrid] } }
      responses:
        '200':
          description: Families
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Family' } }
  /api/families/{id}:
    get:
      tags: [families]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Family, content: { application/json: { schema: { $ref: '#/components/schemas/Family' } } } }
        '404': { description: unknown_family, $ref: '#/components/responses/Problem' }
  /api/bases:
    get:
      summary: Bought-in bases (Buniyaad) that hybrid families (Jod) plug into
      description: |
        Available bases only, in display order, with the hybrid families that fit each one (`families`, the ids of
        orderable families listing the base). Stock is summarised, never itemised: `availability.in_stock`,
        `available_qty` (stock minus reservations, capped for display) and `lead_days`. A customer-owned base (the
        customer's own bottle or pot) is a size class: `customer_owned`, no price, always in stock.
      tags: [bases]
      parameters:
        - { name: family_id, in: query, schema: { type: string }, description: Only bases that family lists }
      responses:
        '200':
          description: Bases
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BaseItem' } }
  /api/bases/{sku}:
    get:
      summary: One base, available or not (`available` says whether it is offered)
      tags: [bases]
      parameters: [{ name: sku, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Base, content: { application/json: { schema: { $ref: '#/components/schemas/BaseItem' } } } }
        '404': { description: unknown_base, $ref: '#/components/responses/Problem' }
  /api/experiences:
    get:
      summary: Experiences (Duniya) on the Shop, in display order
      description: |
        The Shop's second persona, "Duniya · Experiences": themes that tie a stage backdrop, a default style and a motif
        pack to a set of Avatars and curated Shop items. Only `available` experiences are listed, by `sort_order`.
        `avatars` are the experience's families that can be ordered today (available and backed by a live template), in
        the experience's order and in the shape of `GET /api/families`; `items` are its curated Shop items in order
        (unavailable ones keep their Coming soon state). `price_from_paise` is the lowest floor among those avatars.
        Needs the geometry service for readiness, like `GET /api/families` (503 `geometry_unavailable`).
      tags: [experiences]
      responses:
        '200':
          description: Experiences
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Experience' } }
        '503': { description: geometry_unavailable, $ref: '#/components/responses/Problem' }
  /api/experiences/{slug}:
    get:
      summary: Experience by URL slug
      description: |
        Any experience, available or not (`available` says whether the Shop lists it), so a deep link such as
        `/duniya/katha` can say "coming soon"; 404 `unknown_experience` otherwise.
      tags: [experiences]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Experience, content: { application/json: { schema: { $ref: '#/components/schemas/Experience' } } } }
        '404': { description: unknown_experience, $ref: '#/components/responses/Problem' }
        '503': { description: geometry_unavailable, $ref: '#/components/responses/Problem' }
  /api/environments:
    get:
      summary: Viewer backdrops (Mahaul) in display order
      description: |
        The reference data behind every `environment` field (experiences, families, template descriptors, Shop items).
        `preset_key` names the storefront viewer preset that renders the backdrop; presets are code, which backdrop a
        piece uses is data.
      tags: [experiences]
      responses:
        '200':
          description: Environments
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Environment' } }
  /api/motifs:
    get:
      summary: The Buti motif library (packages/design-tokens/motifs/index.json) with preview URLs
      description: |
        Motifs a customer can place with a `motif` feature. `min_scale` is the smallest scale that still prints
        (strokes and openings stay at least 0.8 mm); scale 1 fills the anchor's spot. Preview artwork is served at
        `svg_url`.
      tags: [motifs]
      responses:
        '200':
          description: Motifs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Motif' } }
  /api/motifs/{id}.svg:
    get:
      summary: Motif artwork (single-path SVG) for previews
      tags: [motifs]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: SVG, content: { image/svg+xml: { schema: { type: string } } } }
        '404': { description: unknown_motif, $ref: '#/components/responses/Problem' }
  /api/templates:
    get:
      summary: Template descriptors (cached from the geometry service)
      tags: [templates]
      responses:
        '200':
          description: Descriptors
          content:
            application/json:
              schema: { type: array, items: { $ref: '../schemas/template-descriptor.v1.json' } }
  /api/templates/{id}:
    get:
      tags: [templates]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Descriptor, content: { application/json: { schema: { $ref: '../schemas/template-descriptor.v1.json' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/uploads:
    post:
      summary: Upload customer content (an image for a relief, or a model file for Swaroop or a hero form)
      description: |
        `multipart/form-data` with `file` and `kind` (`image` | `model`). Images: png, jpg, webp, heic up to
        15 MB. Models: stl, glb, 3mf, obj, ply, off, gltf up to 50 MB. Requires a known identity (user or
        guest header). Uploads the content scanner flags answer with `status: pending_review` and cannot be
        placed on a design until a reviewer approves them (409 `upload_not_ready`, 422 `upload_rejected`). The scanner
        holds a file whose name mentions a content rule the studio manages in its portal (licensed heroes and brands,
        the Katha guardrail), case, spaces and punctuation ignored.
      tags: [uploads]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: { type: string, format: binary }
                kind: { type: string, enum: [image, model] }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '400': { description: Missing file or kind, $ref: '#/components/responses/Problem' }
        '401': { description: No known identity (neither a signed-in user nor a guest header), $ref: '#/components/responses/Problem' }
        '413': { description: payload_too_large, $ref: '#/components/responses/Problem' }
        '415': { description: Not a multipart request, $ref: '#/components/responses/Problem' }
        '422': { description: "unsupported_format, or upload_rejected when the scanner refuses the file outright, $ref: '#/components/responses/Problem'" }
  /api/uploads/{id}:
    get:
      tags: [uploads]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Upload, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/designs:
    post:
      summary: Start a design
      description: |
        Shop path: `catalog_item_slug` (template and defaults come from the item).
        Remix-lite / direct path: `template_id` + optional `params`.
        Avatar path: `family_id` (+ optional `template_id`, else the family's default) + `features` (the Chhaap:
        text, motif, a photo relief or the customer's own form referencing an upload).
        Swaroop path: `source: upload`, `family_id: raw_print`, one `hero_mesh` feature.
        Create path: `prompt` alone → 422 until Phase 2.
        Any path may name the Duniya experience the customer came from (`experience_id`, 422 `unknown_experience`
        otherwise); the design keeps it so the karigar's note and packaging card can name the theme, and takes the
        experience's style as `spec.style` when the template offers it (`style_variants`), else `none`. Under
        `comic_pop` a text or motif without a `mode` is raised where its anchor allows it, and a raised one without a
        `depth_mm` stands 1.5 mm proud (capped at the anchor's `max_relief_mm`); explicit choices and photos are left alone.
        A hybrid family (Jod) needs a base: `base_sku` names one of the family's bases, else the family's default is taken
        (422 `base_required` when the family lists none that is available); 404 `unknown_base`, 422 `base_not_available`
        (switched off or out of stock with no lead time), 422 `incompatible_base` (the base's Kadi is not the family's).
        The version keeps the base (`base_sku`, `base`) and its spec carries `spec.base` for the geometry service.
        Content is checked as the geometry service will build it: 422 `unsupported_feature` when a feature's mode (its
        type's default when left out) is not in its anchor's `modes` (`params.field` = `features[i].mode`), 422
        `validation_failed` when an anchor marked `required` has no content, and 422 `protected_term` when a text (Naam)
        names a licensed hero or brand ("We can't print copyrighted heroes or their names, but your own hero is welcome.
        Try your own hero's name."; the term is never echoed).
        Returns 202 with the design and the first generation job. Follow `/api/jobs/{id}/events`.
      tags: [designs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDesignRequest' }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/DesignAccepted' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/designs/{id}:
    get:
      tags: [designs]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Design with latest version, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/designs/{id}/versions:
    get:
      tags: [designs]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DesignVersion' } }
  /api/versions/{versionId}:
    get:
      tags: [versions]
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Version, content: { application/json: { schema: { $ref: '#/components/schemas/DesignVersion' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/versions/{versionId}/params:
    post:
      summary: Edit parameters → new version (new job)
      description: |
        The new version keeps the parent's style. Its content is checked like a new design's, and every text (Naam), kept
        or new, against the content rules again (422 `protected_term`), since a rule may have been added since.
      tags: [versions]
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [params]
              properties:
                params: { type: object, additionalProperties: { type: [number, integer, boolean, string] } }
                material: { type: string }
                features:
                  type: [array, 'null']
                  maxItems: 8
                  description: Replaces the parent version's features when present (empty array clears them); omitted or null keeps them. Items follow schemas/design-spec.v1.json#/$defs/feature.
                  items: { type: object, additionalProperties: true }
                base_sku: { type: [string, 'null'], description: "Hybrid pieces: switch the base (one the family lists; same errors as POST /api/designs); omitted or null keeps the parent's" }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/DesignAccepted' } } } }
        '400': { description: More than 8 features or a malformed body, $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: upload_not_ready (a referenced upload is still in review), $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/versions/{versionId}/printability:
    get:
      tags: [versions]
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '../schemas/printability-report.v1.json' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Version not ready yet, $ref: '#/components/responses/Problem' }
  /api/versions/{versionId}/price:
    get:
      summary: Price breakdown for a material
      tags: [versions]
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: material, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Breakdown, content: { application/json: { schema: { $ref: '../schemas/price-breakdown.v1.json' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Version not ready yet, $ref: '#/components/responses/Problem' }
  /api/jobs/{jobId}:
    get:
      tags: [jobs]
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/jobs/{jobId}/events:
    get:
      summary: Server-Sent Events stream of job stages
      description: |
        `text/event-stream`. Each event is `event: stage` with a JSON `data` body shaped like
        `JobStageEvent`. The stream replays the current stage on connect and closes after
        `ready` or `failed`. Clients reconnect with `Last-Event-ID` (the sequence number).
      tags: [jobs]
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/auth/otp/request:
    post:
      summary: Request a sign-in code for a phone number
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, pattern: '^\+91[6-9][0-9]{9}$', description: E.164 Indian mobile }
      responses:
        '202':
          description: Code sent (or mocked)
          content:
            application/json:
              schema:
                type: object
                required: [request_id, expires_in_s]
                properties:
                  request_id: { type: string, format: uuid }
                  expires_in_s: { type: integer }
                  dev_code: { type: string, description: Only in the local profile with the mock OTP sender }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { description: "Too many requests for this phone (otp_rate_limited)", $ref: '#/components/responses/Problem' }
  /api/auth/otp/verify:
    post:
      summary: Verify the code, sign in, attach guest designs and cart
      tags: [auth]
      parameters: [{ $ref: '#/components/parameters/GuestHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, code]
              properties:
                request_id: { type: string, format: uuid }
                code: { type: string, minLength: 4, maxLength: 8 }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: "Wrong or expired code (otp_invalid / otp_expired)", $ref: '#/components/responses/Problem' }
  /api/auth/me:
    get:
      summary: Current user
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Update profile
      tags: [auth]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/auth/logout:
    post:
      summary: Revoke the current session token
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        '204': { description: Revoked }
  /api/me/addresses:
    get:
      tags: [addresses]
      security: [{ bearer: [] }]
      responses:
        '200': { description: Addresses, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Address' } } } } }
    post:
      tags: [addresses]
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /api/me/addresses/{addressId}:
    put:
      tags: [addresses]
      security: [{ bearer: [] }]
      parameters: [{ name: addressId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [addresses]
      security: [{ bearer: [] }]
      parameters: [{ name: addressId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /api/cart:
    get:
      summary: The current identity's cart (user or guest)
      tags: [cart]
      parameters: [{ $ref: '#/components/parameters/GuestHeader' }]
      security: [{ bearer: [] }, {}]
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
    delete:
      summary: Empty the cart
      tags: [cart]
      parameters: [{ $ref: '#/components/parameters/GuestHeader' }]
      security: [{ bearer: [] }, {}]
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /api/cart/items:
    post:
      summary: Add a design version in a finish
      description: "The version must be ready and pass printability. The unit price is snapshotted from the active pricing policy at add time and refreshed on GET /api/cart when the policy changes (the item then carries repriced = true)."
      tags: [cart]
      parameters: [{ $ref: '#/components/parameters/GuestHeader' }]
      security: [{ bearer: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version_id, material]
              properties:
                version_id: { type: string, format: uuid }
                material: { type: string }
                qty: { type: integer, minimum: 1, maximum: 20, default: 1 }
      responses:
        '201': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: "Version not ready (version_not_ready) or failed printability (not_printable)", $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/cart/items/{itemId}:
    patch:
      tags: [cart]
      parameters:
        - { $ref: '#/components/parameters/GuestHeader' }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ bearer: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                qty: { type: integer, minimum: 1, maximum: 20 }
                material: { type: string }
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [cart]
      parameters:
        - { $ref: '#/components/parameters/GuestHeader' }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ bearer: [] }, {}]
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/shipping/serviceability:
    get:
      summary: Can we deliver to this pincode, and how fast
      tags: [shipping]
      parameters: [{ name: pincode, in: query, required: true, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }]
      responses:
        '200':
          description: Serviceability
          content:
            application/json:
              schema:
                type: object
                required: [pincode, serviceable, carrier]
                properties:
                  pincode: { type: string }
                  serviceable: { type: boolean }
                  carrier: { type: string, description: "delhivery, or mock-delhivery" }
                  eta_days: { type: integer }
                  cod_available: { type: boolean }
  /api/checkout:
    post:
      summary: Turn the cart into an order awaiting payment
      description: Snapshots items, prices and address into the order and empties the cart at once (so a second checkout answers 409 cart_empty rather than creating a duplicate order); creates a payment with the configured gateway (mock by default) and returns where to pay. An unpaid order can be paid later from the order page (POST /api/orders/{id}/payments).
      tags: [orders]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address_id]
              properties:
                address_id: { type: string, format: uuid }
                notify_whatsapp: { type: boolean, default: true }
                note: { type: string, maxLength: 200 }
      responses:
        '201': { description: Order created, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { description: "Cart empty (cart_empty) or an item no longer purchasable (not_printable)", $ref: '#/components/responses/Problem' }
        '422': { description: "Address not serviceable (not_serviceable)", $ref: '#/components/responses/Problem' }
  /api/orders:
    get:
      tags: [orders]
      security: [{ bearer: [] }]
      responses:
        '200': { description: Orders newest first, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } } } } }
  /api/orders/{orderId}:
    get:
      tags: [orders]
      security: [{ bearer: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/orders/{orderId}/events:
    get:
      summary: Server-Sent Events of order stage changes
      description: "event = stage, data = OrderEvent; replays after Last-Event-ID; closes after delivered or cancelled."
      tags: [orders]
      security: [{ bearer: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
  /api/orders/{orderId}/payments:
    post:
      summary: Start a new payment attempt for an order still awaiting payment
      description: Used after a failed or abandoned payment. Only while the order is pending_payment; the previous attempt is left as failed.
      tags: [payments]
      security: [{ bearer: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '201': { description: New payment, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: "Order is not awaiting payment (order_not_payable)", $ref: '#/components/responses/Problem' }
  /api/payments/{paymentId}:
    get:
      tags: [payments]
      security: [{ bearer: [] }]
      parameters: [{ name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/payments/{paymentId}/mock/complete:
    post:
      summary: Placeholder gateway page reports the outcome (mock gateway only)
      description: Enabled only when the payment's gateway is mock. Real gateways confirm through their webhook endpoints instead. Runs the same confirmation path a webhook would.
      tags: [payments]
      security: [{ bearer: [] }]
      parameters: [{ name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome: { type: string, enum: [success, failure] }
                method: { type: string, enum: [upi, card, netbanking], default: upi }
      responses:
        '200': { description: Payment after confirmation, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: "Not a mock payment or already final (payment_final)", $ref: '#/components/responses/Problem' }
  /api/share/{code}:
    get:
      summary: What the unboxing card links to
      description: Public, unauthenticated, rate-limited. The 8-character code is printed on the packaging card as /k/{code}. Answers with the piece and where to reprint or remix it; no customer data.
      tags: [share]
      security: []
      parameters: [{ name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z2-7]{8}$' } }]
      responses:
        '200':
          description: Shared piece
          content:
            application/json:
              schema:
                type: object
                required: [code, title, material_id, material_name, design_id, version_id, template_id, printed_at, studio, reprint_path, remix_path]
                properties:
                  code: { type: string }
                  title: { type: string }
                  specs_line: { type: string }
                  material_id: { type: string }
                  material_name: { type: string }
                  design_id: { type: string, format: uuid }
                  version_id: { type: string, format: uuid }
                  template_id: { type: string }
                  printed_at: { type: string, format: date }
                  studio: { type: string }
                  thumbnail_url: { type: [string, 'null'] }
                  reprint_path: { type: string, description: "Storefront path that recreates this exact piece in the cart, e.g. /design/new?version=<id>&material=<id>" }
                  remix_path: { type: string, description: "Storefront path that opens the design for editing, e.g. /design/<design_id>" }
                  base_sku: { type: [string, 'null'], description: "Hybrid pieces: the base the printed part plugs into" }
                  base_name: { type: [string, 'null'], description: "Its customer-facing name, e.g. Steel headphone stand" }
                  base_path: { type: [string, 'null'], description: "Storefront page of the base with every top that fits it, e.g. /shop/base/<sku>" }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/jobs/{jobId}/callback:
    post:
      summary: Direct-profile callback from the geometry service
      description: Not exposed publicly. Accepts a `design.progress`, `design.completed` or `design.failed` envelope.
      tags: [internal]
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/events/envelope.v1.json' }
      responses:
        '204': { description: Recorded }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    GuestHeader:
      name: X-Aakar-Guest
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Guest identity generated by the browser; ignored when a bearer token is present.
  responses:
    Problem:
      description: Problem Details
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
              code:
                type: string
                description: "Stable machine code, e.g. not_found, validation_failed, not_yet_available, param_out_of_range, unsupported_feature, protected_term (a text naming a licensed hero or brand), version_not_ready, unauthenticated, otp_invalid, otp_expired, otp_rate_limited, not_printable, cart_empty, not_serviceable, payment_final, unknown_family, unknown_experience, unknown_base, base_required, base_not_available, incompatible_base, base_out_of_stock"
  schemas:
    User:
      type: object
      required: [id, phone, created_at]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Session:
      type: object
      required: [access_token, token_type, expires_in_s, user, attached]
      properties:
        access_token: { type: string }
        token_type: { const: Bearer }
        expires_in_s: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        attached:
          type: object
          description: What was moved from the guest identity to the user on this sign-in.
          properties:
            designs: { type: integer }
            cart_items: { type: integer }
    AddressInput:
      type: object
      additionalProperties: false
      required: [name, phone, line1, city, state, pincode]
      properties:
        label: { type: string, maxLength: 30, description: "Home or Office" }
        name: { type: string, maxLength: 80 }
        phone: { type: string }
        line1: { type: string, maxLength: 120 }
        line2: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 60 }
        state: { type: string, maxLength: 60 }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        is_default: { type: boolean, default: false }
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    CartItem:
      type: object
      required: [id, design_id, version_id, title, material_id, qty, unit_price, line_total_paise, purchasable]
      properties:
        id: { type: string, format: uuid }
        design_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        version_no: { type: integer }
        title: { type: string }
        specs_line: { type: string, description: "e.g. Terracotta Silk · 92 × 78 × 120 mm · 55 g" }
        material_id: { type: string }
        material_name: { type: string }
        qty: { type: integer }
        unit_price: { $ref: '../schemas/price-breakdown.v1.json' }
        line_total_paise: { type: integer }
        thumbnail_url: { type: [string, 'null'] }
        purchasable: { type: boolean, description: "False when the version failed printability, the template is no longer live, or the piece's base is switched off or out of stock with no lead time" }
        repriced: { type: boolean, description: True when the active pricing policy changed since the item was added }
        family_id: { type: [string, 'null'], description: "The outcome family of the piece, for the cart's Jod cross-sell" }
        base: { oneOf: [{ $ref: '#/components/schemas/BaseItem' }, { type: 'null' }], description: "Hybrid pieces: the base shipped with the printed part (or the customer-owned class it fits), with its availability" }
    Cart:
      type: object
      required: [id, owner, items, subtotal_paise, shipping_paise, total_paise, policy_version, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner: { type: string, enum: [user, guest] }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        subtotal_paise: { type: integer }
        shipping_paise: { type: integer }
        shipping_label: { type: string }
        shipping_weight_g: { type: number, description: "Sum of the items' shipping_weight_g × qty: what the weight tier was read against" }
        total_paise: { type: integer }
        policy_version: { type: string }
        updated_at: { type: string, format: date-time }
    OrderStatus:
      type: string
      description: "Internal status. The customer stage is derived. assembling (the Chhaap seated on its base, an adapter bonded) sits between finishing and qc and is offered only for orders that carry a base."
      enum: [pending_payment, confirmed, queued, slicing, printing, finishing, assembling, qc, packed, shipped, delivered, cancelled, on_hold, reprint]
    OrderStage:
      type: string
      description: Customer-facing collapsed stage (board 06).
      enum: [payment, queued, slicing, printing, sanding, shipped, delivered, cancelled]
    OrderItem:
      type: object
      required: [id, design_id, version_id, title, material_id, qty, unit_price, line_total_paise]
      properties:
        id: { type: string, format: uuid }
        design_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        version_no: { type: integer }
        title: { type: string }
        specs_line: { type: string }
        material_id: { type: string }
        material_name: { type: string }
        qty: { type: integer }
        unit_price: { $ref: '../schemas/price-breakdown.v1.json' }
        line_total_paise: { type: integer }
        assets: { type: object, additionalProperties: true, description: Snapshot of the version assets at order time }
        base_sku: { type: [string, 'null'], description: "Hybrid pieces: the base shipped with (or fitted by) this item" }
        base_snapshot: { type: [object, 'null'], additionalProperties: true, description: "The base as sold: sku, name, customer_owned, weight_g, the base price line, the adapter sku and the Kadi (kind, nominal_mm), so the print pack and the card never drift" }
    OrderSummary:
      type: object
      required: [id, number, status, stage, total_paise, items_count, placed_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, description: "AK-000001" }
        status: { $ref: '#/components/schemas/OrderStatus' }
        stage: { $ref: '#/components/schemas/OrderStage' }
        title: { type: string, description: First item title plus a count of the others }
        total_paise: { type: integer }
        items_count: { type: integer }
        eta: { type: [string, 'null'], format: date }
        placed_at: { type: string, format: date-time }
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [items, address, subtotal_paise, shipping_paise, payment, events]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
            address: { $ref: '#/components/schemas/Address' }
            subtotal_paise: { type: integer }
            shipping_paise: { type: integer }
            shipping_label: { type: string }
            policy_version: { type: string }
            payment: { $ref: '#/components/schemas/Payment' }
            shipment: { $ref: '#/components/schemas/Shipment' }
            events: { type: array, items: { $ref: '#/components/schemas/OrderEvent' } }
            notify_whatsapp: { type: boolean }
            note: { type: [string, 'null'] }
    OrderEvent:
      type: object
      required: [sequence, status, stage, message, at]
      properties:
        sequence: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        stage: { $ref: '#/components/schemas/OrderStage' }
        message: { type: string }
        detail: { type: object, additionalProperties: true, description: "Studio, printer bay and layer height for the tracking board" }
        at: { type: string, format: date-time }
    Payment:
      type: object
      required: [id, order_id, gateway, status, amount_paise, currency, created_at]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        gateway: { type: string, description: "mock or razorpay" }
        gateway_ref: { type: [string, 'null'], description: Provider order or payment id }
        status: { type: string, enum: [created, pending, succeeded, failed, refunded] }
        method: { type: [string, 'null'] }
        amount_paise: { type: integer }
        currency: { const: INR }
        pay_url: { type: [string, 'null'], description: Where the customer pays; the placeholder page for the mock gateway }
        invoice_number: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    Shipment:
      type: object
      required: [id, carrier, status]
      properties:
        id: { type: string, format: uuid }
        carrier: { type: string }
        awb: { type: [string, 'null'] }
        status: { type: string, enum: [created, picked_up, in_transit, out_for_delivery, delivered, returned] }
        eta: { type: [string, 'null'], format: date }
        tracking_url: { type: [string, 'null'] }
        events: { type: array, items: { type: object, properties: { status: { type: string }, message: { type: string }, at: { type: string, format: date-time } } } }
    CheckoutResult:
      type: object
      required: [order_id, order_number, payment]
      properties:
        order_id: { type: string, format: uuid }
        order_number: { type: string }
        payment: { $ref: '#/components/schemas/Payment' }
    CatalogItem:
      type: object
      required: [slug, name, category, template_id, default_params, default_material, base_price_paise, specs_line, available]
      properties:
        slug: { type: string }
        available: { type: boolean, description: "False until the item's template exists in the geometry service; the Shop shows a 'Coming soon' ribbon and POST /api/designs answers 422 template_not_available." }
        name: { type: string }
        category: { type: string, description: A shelf id from GET /api/catalog/shelves }
        family_id: { type: [string, 'null'], description: "Outcome family (Avatar) of the item's template, when known" }
        description: { type: string }
        template_id: { type: string }
        default_params: { type: object, additionalProperties: true }
        default_material: { type: string }
        base_price_paise: { type: integer }
        specs_line: { type: string, description: "e.g. 'Fits phones to 6.9″ · 92 × 78 × 120 mm · 64 g'" }
        environment: { type: string, description: "Viewer backdrop, an environment id from GET /api/environments" }
        media: { type: array, items: { type: object, properties: { kind: { type: string }, url: { type: string } } } }
    Material:
      type: object
      required: [id, name, filament, density_g_cm3, finish_class, rate_per_g_paise, pbr]
      properties:
        id: { type: string }
        name: { type: string }
        filament: { type: string }
        density_g_cm3: { type: number }
        finish_class: { type: string, enum: [matte, silk] }
        rate_per_g_paise: { type: integer }
        heat_safe: { type: boolean }
        pbr:
          type: object
          required: [color, roughness, metalness]
          properties:
            color: { type: string, description: sRGB hex }
            roughness: { type: number }
            metalness: { type: number }
            clearcoat: { type: number }
            clearcoat_roughness: { type: number }
            sheen: { type: number }
            sheen_color: { type: string }
    Motif:
      type: object
      required: [id, label, tags, min_scale, svg_url]
      properties:
        id: { type: string, description: "motif_id for a motif feature, e.g. paisley" }
        label: { type: string, description: "Plain name shown with the Buti label, e.g. Paisley" }
        tags: { type: array, items: { type: string } }
        min_scale: { type: number, description: "Smallest scale that still prints (strokes and openings at least 0.8 mm)" }
        svg_url: { type: string, description: Browser URL of the motif artwork }
    Shelf:
      type: object
      required: [id, label, sort_order]
      properties:
        id: { type: string }
        label: { type: string }
        sort_order: { type: integer }
    HardwareRef:
      type: object
      required: [sku, qty]
      properties:
        sku: { type: string }
        qty: { type: integer }
        name: { type: string, description: "Customer-facing hardware name, filled by the API from hardware_items" }
    Connector:
      type: object
      description: The Kadi a hybrid family (Jod) cuts into its Chhaap. Same fields as schemas/template-family.v1.json#/$defs/connector.
      required: [kind, nominal_mm, fit]
      properties:
        kind: { type: string, enum: [socket, dovetail, magnet, thread, rim_clip] }
        nominal_mm: { type: number }
        fit: { type: string, enum: [slide, press_ribbed, snap, pocket] }
        form: { type: string, enum: [cap, lid, rim], description: rim_clip only }
        thread: { type: string, enum: [unc_1_4, m10x1, e27, e14], description: thread only }
        mode: { type: string, enum: [magnets, steel_disc], description: magnet only }
        adapter_sku: { type: string, description: Bought-in male part packed with the piece when the base has none of its own }
    BaseInterface:
      type: object
      description: What a base presents to the Chhaap, seen from the male side. Same fields as schemas/template-family.v1.json#/$defs/base_interface.
      required: [kind, nominal_mm]
      properties:
        kind: { type: string, enum: [socket, dovetail, magnet, thread, rim_clip] }
        nominal_mm: { type: number }
        tolerance_class: { type: string, enum: [machined, molded, wood, ceramic, glass, steel] }
        range_mm: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: "Customer-owned bases: the size class the Chhaap grips" }
        form: { type: string, enum: [cap, lid, rim] }
        thread: { type: string, enum: [unc_1_4, m10x1, e27, e14] }
        mode: { type: string, enum: [magnets, steel_disc] }
        adapter_sku: { type: string }
    MountFrame:
      type: object
      description: Where the Chhaap's connector mouth sits on the base, in the base's frame (standing on z = 0, centred on the z axis).
      required: [origin_mm, up]
      properties:
        origin_mm: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        up: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        forward: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
    BaseAvailability:
      type: object
      required: [in_stock, available_qty, lead_days, label]
      properties:
        in_stock: { type: boolean, description: "True when stock minus reservations is positive, or the base is customer-owned" }
        available_qty: { type: integer, description: "Stock minus reservations, capped at 20 for display; 0 for a customer-owned base" }
        lead_days: { type: integer }
        label: { type: string, description: "Customer copy, e.g. 'In stock · ships in 2 days', 'Back in about 7 days', 'Yours already'" }
    BaseItem:
      type: object
      description: |
        A bought-in base (Buniyaad) a hybrid family's Chhaap plugs into: the public view of
        schemas/template-family.v1.json#/$defs/base_item (no cost, supplier or stock ledger).
      required: [sku, name, category, base_material, dimensions_mm, weight_g, interface, mount_frame, finish_pbr, customer_owned, lead_days, available, availability, families]
      properties:
        sku: { type: string }
        name: { type: string, description: "Customer-facing, e.g. Steel headphone stand" }
        description: { type: string }
        category: { type: string, enum: [desk, home, lighting, auto, kids, bath, plants] }
        base_material: { type: string }
        dimensions_mm: { type: array, items: { type: number }, minItems: 3, maxItems: 3, description: "Width, depth, height" }
        weight_g: { type: number }
        interface: { $ref: '#/components/schemas/BaseInterface' }
        mount_frame: { $ref: '#/components/schemas/MountFrame' }
        preview_glb_url: { type: [string, 'null'], description: "The base's model for the two-model viewer (generated from its preview shape, or uploaded by staff)" }
        photos: { type: array, items: { type: object, required: [url], properties: { url: { type: string }, alt: { type: string } } } }
        finish_pbr: { $ref: '#/components/schemas/Material/properties/pbr' }
        price_paise: { type: [integer, 'null'], description: "The base line a customer pays (retail, or cost with the policy's base markup); null for a customer-owned base" }
        customer_owned: { type: boolean }
        lead_days: { type: integer }
        hsn_code: { type: [string, 'null'] }
        compliance_notes: { type: [string, 'null'] }
        available: { type: boolean }
        availability: { $ref: '#/components/schemas/BaseAvailability' }
        families: { type: array, items: { type: string }, description: "Ids of the orderable hybrid families that list this base, default-first" }
        sort_order: { type: integer }
    Family:
      type: object
      description: An outcome category (Avatar). Same fields as schemas/template-family.v1.json#/$defs/family plus read-only state.
      required: [id, codename, name, kind, tier, shelf, default_template_id, shape_tolerance, content_slot, available, ready, templates]
      properties:
        id: { type: string }
        codename: { type: string, description: "Brand name shown to customers, e.g. Saathi" }
        name: { type: string, description: "Plain descriptor always shown with the codename, e.g. Keychain & bag charm" }
        tagline: { type: string }
        description: { type: string }
        kind: { type: string, enum: [carrier, object, raw, hybrid] }
        tier: { type: string, enum: [launch, next, later] }
        shelf: { type: string }
        demand_rank: { type: integer }
        default_template_id: { type: string }
        environment: { type: string, description: "Default viewer backdrop, an environment id from GET /api/environments" }
        size_envelope_mm:
          type: object
          properties:
            min_longest_mm: { type: number }
            max_longest_mm: { type: number }
        hardware: { type: array, items: { $ref: '#/components/schemas/HardwareRef' } }
        material_rules:
          type: object
          properties:
            heat_safe_only: { type: boolean }
            allowed: { type: [array, 'null'], items: { type: string } }
            excluded_finish_classes: { type: array, items: { type: string } }
        shape_tolerance: { type: string, enum: [any, constrained, strict] }
        content_slot:
          type: object
          required: [accepts]
          properties:
            accepts: { type: array, items: { type: string, enum: [emboss_text, motif, relief_image, hero_mesh] } }
            anchors: { type: array, items: { type: string } }
            hero_volume: { type: boolean }
            max_text_chars: { type: integer }
        available: { type: boolean }
        sort_order: { type: integer }
        ready: { type: boolean, description: True when at least one live template of this family exists in the geometry service }
        templates: { type: array, items: { $ref: '../schemas/template-descriptor.v1.json' } }
        price_from_paise: { type: [integer, 'null'], description: "A floor: the family's minimum from the active pricing policy, when one is set; for a hybrid family the default base's price line is added" }
        connector: { oneOf: [{ $ref: '#/components/schemas/Connector' }, { type: 'null' }], description: "Hybrid families: the Kadi their templates cut" }
        bases: { type: array, items: { $ref: '#/components/schemas/BaseItem' }, description: "Hybrid families: the bases the Chhaap fits, default first; only available ones (a customer-owned class always is)" }
        assembly_minutes: { type: [integer, 'null'], description: Studio time to seat the Chhaap on its base }
        pair_family_id: { type: [string, 'null'], description: "The other form of the same idea (the fully printed family for a hybrid, and the reverse) for the 'Whole or plug-in?' compare" }
        typical_print_minutes: { type: [integer, 'null'], description: "Printer time of a typical piece, for the compare card" }
    Environment:
      type: object
      description: A viewer backdrop (Mahaul). Same fields as schemas/experience.v1.json#/$defs/environment.
      required: [id, label, surface, preset_key, sort_order]
      properties:
        id: { type: string }
        label: { type: string, description: "Plain name, e.g. Chettinad teak · candlelight" }
        surface: { type: string, enum: [stage, paper], description: The surface the backdrop sits on }
        preset_key: { type: string, description: The storefront viewer preset that renders it (src/lib/viewer/environments.ts) }
        palette: { type: array, items: { type: string }, description: "Swatches (sRGB hex) for thumbnails and theme previews, the backdrop colour first" }
        sort_order: { type: integer }
    ExperienceSurface:
      type: object
      description: Page theming of an experience. The cream paper stays; the accent and the hero change.
      required: [accent]
      properties:
        accent: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: sRGB hex from the brand palette }
        paper_tint: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$', description: A light tint over the cream paper; null keeps plain cream }
        hero_media: { type: [string, 'null'], maxLength: 500, description: URL or site path of the hero image or loop; null until one is shot }
    ExperienceCollection:
      type: object
      description: A sub-collection, e.g. a licensed universe; none until a licence exists
      required: [id, title]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 40 }
        title: { type: string, maxLength: 80 }
        licence_ref: { type: [string, 'null'], maxLength: 120, description: The licence agreement that allows it; null for original work }
    SeasonWindow:
      type: object
      description: When an experience is in season. Both ends are dates (starts_on ≤ ends_on) or both are month-days that recur every year and may wrap the new year.
      required: [starts_on, ends_on, label]
      properties:
        starts_on: { type: string, pattern: '^([0-9]{4}-[0-9]{2}-[0-9]{2}|--[0-9]{2}-[0-9]{2})$', description: "A date (2026-10-20) or an ISO month-day (--10-01)" }
        ends_on: { type: string, pattern: '^([0-9]{4}-[0-9]{2}-[0-9]{2}|--[0-9]{2}-[0-9]{2})$', description: "A date (2026-11-10) or an ISO month-day (--11-30)" }
        label: { type: string, maxLength: 40, description: "Badge text, e.g. Diwali" }
    Experience:
      type: object
      description: |
        An experience (Duniya): a theme on the Shop. The row fields are those of schemas/experience.v1.json#/$defs/experience;
        here `avatars` are expanded to the families that can be ordered today (the shape of GET /api/families, in the
        experience's order) and `items` to the curated Shop items.
      required: [id, codename, slug, title, environment, surface, style, motif_pack, avatars, items, collections, season, available, sort_order]
      properties:
        id: { type: string, description: "snake_case id, e.g. festive; what CreateDesignRequest.experience_id names" }
        codename: { type: string, description: "Brand name shown to customers, e.g. Utsav" }
        slug: { type: string, description: "URL slug of the experience page, e.g. utsav" }
        title: { type: string, description: "Plain descriptor always shown with the codename, e.g. Festive & gifting" }
        tagline: { type: string }
        description: { type: string }
        environment: { type: string, description: The backdrop (an environment id) for the page's stage strip and the studio preset }
        surface: { $ref: '#/components/schemas/ExperienceSurface' }
        style: { type: string, enum: [none, jaipur_heritage, modern_zen, cyber_desi, warli_line, comic_pop], description: "Style variant a design started from this experience takes (spec.style) when its template offers it (style_variants); none otherwise" }
        motif_pack: { type: array, items: { type: string }, description: Motif ids (or a pack id) offered first in the Chhaap panel's Buti tab }
        avatars: { type: array, items: { $ref: '#/components/schemas/Family' }, description: "The experience's orderable families, in its order" }
        items: { type: array, items: { $ref: '#/components/schemas/CatalogItem' }, description: "Curated Shop items, in order" }
        collections: { type: array, items: { $ref: '#/components/schemas/ExperienceCollection' } }
        season: { type: array, items: { $ref: '#/components/schemas/SeasonWindow' } }
        available: { type: boolean, description: Whether the Shop lists it }
        sort_order: { type: integer }
        price_from_paise: { type: [integer, 'null'], description: "The lowest price_from_paise among the avatars (a floor for 'from ₹249'); null when none sets one" }
        promote:
          type: [object, 'null']
          description: "Family kinds the theme page lists first and the ribbon they wear (a Jod: 'Faster · lighter on the pocket'); null keeps the avatars' own order"
          required: [kinds]
          properties:
            kinds: { type: array, items: { type: string, enum: [carrier, object, raw, hybrid] } }
            ribbon: { type: string }
    Upload:
      type: object
      required: [id, kind, format, bytes, status, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [image, model] }
        format: { type: string }
        bytes: { type: integer }
        sha256: { type: string }
        status: { type: string, enum: [ready, pending_review, rejected] }
        url: { type: [string, 'null'], description: Browser-fetchable URL when ready }
        message: { type: [string, 'null'], description: "Customer-facing note, e.g. the reviewer's reason when status is rejected" }
        created_at: { type: string, format: date-time }
    CreateDesignRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { type: string, enum: [shop, create, remix, upload] }
        catalog_item_slug: { type: string }
        family_id: { type: string, description: "Outcome family (Avatar). Without template_id the family's default template is used. raw_print with source upload is the Swaroop path." }
        template_id: { type: string }
        params: { type: object, additionalProperties: { type: [number, integer, boolean, string] } }
        material: { type: string }
        features:
          type: array
          maxItems: 8
          description: Content features (Chhaap) following schemas/design-spec.v1.json#/$defs/feature. Content sources name an upload_id; the API fills the url.
          items: { type: object, additionalProperties: true }
        prompt: { type: string, maxLength: 500 }
        title: { type: string, maxLength: 80 }
        experience_id: { type: string, maxLength: 40, description: "The Duniya experience the customer started from (an id from GET /api/experiences, e.g. festive); 422 unknown_experience otherwise. Its style becomes spec.style when the template offers it (style_variants), else none" }
        base_sku: { type: string, maxLength: 40, description: "Hybrid families: the base the Chhaap will plug into (one of the family's bases; its default when omitted). 404 unknown_base, 422 base_not_available / incompatible_base / base_required" }
    DesignAccepted:
      type: object
      required: [design_id, version_no, job_id, events_url]
      properties:
        design_id: { type: string, format: uuid }
        version_no: { type: integer }
        job_id: { type: string, format: uuid }
        events_url: { type: string }
    Design:
      type: object
      required: [id, source, title, status, created_at, versions_count]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [shop, create, remix, upload] }
        catalog_item_slug: { type: [string, 'null'] }
        family_id: { type: [string, 'null'] }
        experience_id: { type: [string, 'null'], description: "The Duniya experience the design started from, when it named one" }
        title: { type: string }
        status: { type: string, enum: [generating, ready, failed] }
        created_at: { type: string, format: date-time }
        versions_count: { type: integer }
        latest_version: { $ref: '#/components/schemas/DesignVersion' }
    DesignVersion:
      type: object
      required: [id, design_id, version_no, status, spec, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        design_id: { type: string, format: uuid }
        version_no: { type: integer }
        parent_version_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [generating, ready, failed] }
        spec: { $ref: '../schemas/design-spec.v1.json' }
        template: { type: object, properties: { id: { type: string }, version: { type: integer } } }
        assets: { type: object, additionalProperties: true }
        geometry: { type: object, additionalProperties: true, description: bounds_mm, volume_cm3, surface_cm2, triangles }
        printability: { $ref: '../schemas/printability-report.v1.json' }
        print_estimate: { $ref: '../schemas/print-estimate.v1.json' }
        price: { $ref: '../schemas/price-breakdown.v1.json', description: For spec.material }
        family_id: { type: [string, 'null'] }
        hardware: { type: array, items: { $ref: '#/components/schemas/HardwareRef' }, description: Bought-in parts packed with this piece }
        base_sku: { type: [string, 'null'], description: "Hybrid pieces: the base this version was modelled for" }
        base: { oneOf: [{ $ref: '#/components/schemas/BaseItem' }, { type: 'null' }], description: "That base with its availability, for the two-model viewer and the Ships line" }
        karigar_note: { type: string }
        job_id: { type: string, format: uuid }
        created_by: { type: string, enum: [user, agent, system] }
        created_at: { type: string, format: date-time }
    Job:
      type: object
      required: [id, design_id, version_no, type, status, stage, created_at]
      properties:
        id: { type: string, format: uuid }
        design_id: { type: string, format: uuid }
        version_id: { type: [string, 'null'], format: uuid }
        version_no: { type: integer }
        type: { type: string, enum: [generate] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        stage: { type: string, enum: [queued, understanding, sculpting, checking, pricing, ready, failed] }
        message: { type: string }
        error_code: { type: [string, 'null'] }
        attempts: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    JobStageEvent:
      type: object
      required: [job_id, sequence, stage, message, at]
      properties:
        job_id: { type: string, format: uuid }
        sequence: { type: integer }
        stage: { type: string, enum: [queued, understanding, sculpting, checking, pricing, ready, failed] }
        message: { type: string }
        percent: { type: integer }
        version_id: { type: [string, 'null'], format: uuid }
        error_code: { type: [string, 'null'] }
        at: { type: string, format: date-time }
