openapi: 3.1.0
info:
  title: Aakar API
  version: 1.0.0-phase0
  description: |
    Storefront API served by `services/api` (Spring Boot). Phase 0 covers the vertical slice:
    catalog + materials, designs from a template (Shop and Remix-lite paths), parameter edits,
    job progress over SSE, printability and price per material.

    Create-from-prompt (`prompt` on POST /api/designs) is accepted by the schema but answered
    with 422 `not_yet_available` until the co-designer agent lands in Phase 2.

    Errors use RFC 9457 Problem Details (`application/problem+json`) with a stable `code`.

    **Identity (Phase 1, ADR-0013).** Signed-in customers send `Authorization: Bearer <access_token>`.
    Guests send `X-Aakar-Guest: <uuid>` (generated and stored by the browser). Designs and carts belong
    to whichever identity created them; `POST /api/auth/otp/verify` attaches the guest's designs and cart
    to the user. In the `local` profile the OTP mock returns the code in the response (`dev_code`).
    External providers (payments, shipping, messaging, OTP) are adapters with mock defaults; a mock
    payment is completed from the placeholder pay page through `POST /api/payments/{id}/mock/complete`.
servers:
  - url: http://localhost:8080
paths:
  /api/catalog/items:
    get:
      summary: List Shop items
      tags: [catalog]
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
  /api/catalog/items/{slug}:
    get:
      summary: Shop item by slug
      tags: [catalog]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Item, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogItem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/catalog/materials:
    get:
      summary: Digital materials with rendering presets and rates
      tags: [catalog]
      responses:
        '200':
          description: Materials
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Material' } }
  /api/templates:
    get:
      summary: Template descriptors (cached from the geometry service)
      tags: [templates]
      responses:
        '200':
          description: Descriptors
          content:
            application/json:
              schema: { type: array, items: { $ref: '../schemas/template-descriptor.v1.json' } }
  /api/templates/{id}:
    get:
      tags: [templates]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Descriptor, content: { application/json: { schema: { $ref: '../schemas/template-descriptor.v1.json' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/designs:
    post:
      summary: Start a design
      description: |
        Shop path: `catalog_item_slug` (template and defaults come from the item).
        Remix-lite / direct path: `template_id` + optional `params`.
        Create path: `prompt` → 422 until Phase 2.
        Returns 202 with the design and the first generation job. Follow `/api/jobs/{id}/events`.
      tags: [designs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDesignRequest' }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/DesignAccepted' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/designs/{id}:
    get:
      tags: [designs]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Design with latest version, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/designs/{id}/versions:
    get:
      tags: [designs]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DesignVersion' } }
  /api/versions/{versionId}:
    get:
      tags: [versions]
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Version, content: { application/json: { schema: { $ref: '#/components/schemas/DesignVersion' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/versions/{versionId}/params:
    post:
      summary: Edit parameters → new version (new job)
      tags: [versions]
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [params]
              properties:
                params: { type: object, additionalProperties: { type: [number, integer, boolean, string] } }
                material: { type: string }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/DesignAccepted' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/versions/{versionId}/printability:
    get:
      tags: [versions]
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '../schemas/printability-report.v1.json' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Version not ready yet, $ref: '#/components/responses/Problem' }
  /api/versions/{versionId}/price:
    get:
      summary: Price breakdown for a material
      tags: [versions]
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: material, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Breakdown, content: { application/json: { schema: { $ref: '../schemas/price-breakdown.v1.json' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Version not ready yet, $ref: '#/components/responses/Problem' }
  /api/jobs/{jobId}:
    get:
      tags: [jobs]
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/jobs/{jobId}/events:
    get:
      summary: Server-Sent Events stream of job stages
      description: |
        `text/event-stream`. Each event is `event: stage` with a JSON `data` body shaped like
        `JobStageEvent`. The stream replays the current stage on connect and closes after
        `ready` or `failed`. Clients reconnect with `Last-Event-ID` (the sequence number).
      tags: [jobs]
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/auth/otp/request:
    post:
      summary: Request a sign-in code for a phone number
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, pattern: '^\+91[6-9][0-9]{9}$', description: E.164 Indian mobile }
      responses:
        '202':
          description: Code sent (or mocked)
          content:
            application/json:
              schema:
                type: object
                required: [request_id, expires_in_s]
                properties:
                  request_id: { type: string, format: uuid }
                  expires_in_s: { type: integer }
                  dev_code: { type: string, description: Only in the local profile with the mock OTP sender }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { description: "Too many requests for this phone (otp_rate_limited)", $ref: '#/components/responses/Problem' }
  /api/auth/otp/verify:
    post:
      summary: Verify the code, sign in, attach guest designs and cart
      tags: [auth]
      parameters: [{ $ref: '#/components/parameters/GuestHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, code]
              properties:
                request_id: { type: string, format: uuid }
                code: { type: string, minLength: 4, maxLength: 8 }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: "Wrong or expired code (otp_invalid / otp_expired)", $ref: '#/components/responses/Problem' }
  /api/auth/me:
    get:
      summary: Current user
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Update profile
      tags: [auth]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/auth/logout:
    post:
      summary: Revoke the current session token
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        '204': { description: Revoked }
  /api/me/addresses:
    get:
      tags: [addresses]
      security: [{ bearer: [] }]
      responses:
        '200': { description: Addresses, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Address' } } } } }
    post:
      tags: [addresses]
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /api/me/addresses/{addressId}:
    put:
      tags: [addresses]
      security: [{ bearer: [] }]
      parameters: [{ name: addressId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [addresses]
      security: [{ bearer: [] }]
      parameters: [{ name: addressId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /api/cart:
    get:
      summary: The current identity's cart (user or guest)
      tags: [cart]
      parameters: [{ $ref: '#/components/parameters/GuestHeader' }]
      security: [{ bearer: [] }, {}]
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
    delete:
      summary: Empty the cart
      tags: [cart]
      parameters: [{ $ref: '#/components/parameters/GuestHeader' }]
      security: [{ bearer: [] }, {}]
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /api/cart/items:
    post:
      summary: Add a design version in a finish
      description: "The version must be ready and pass printability. The unit price is snapshotted from the active pricing policy at add time and refreshed on GET /api/cart when the policy changes (the item then carries repriced = true)."
      tags: [cart]
      parameters: [{ $ref: '#/components/parameters/GuestHeader' }]
      security: [{ bearer: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version_id, material]
              properties:
                version_id: { type: string, format: uuid }
                material: { type: string }
                qty: { type: integer, minimum: 1, maximum: 20, default: 1 }
      responses:
        '201': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: "Version not ready (version_not_ready) or failed printability (not_printable)", $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/cart/items/{itemId}:
    patch:
      tags: [cart]
      parameters:
        - { $ref: '#/components/parameters/GuestHeader' }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ bearer: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                qty: { type: integer, minimum: 1, maximum: 20 }
                material: { type: string }
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [cart]
      parameters:
        - { $ref: '#/components/parameters/GuestHeader' }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ bearer: [] }, {}]
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/shipping/serviceability:
    get:
      summary: Can we deliver to this pincode, and how fast
      tags: [shipping]
      parameters: [{ name: pincode, in: query, required: true, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }]
      responses:
        '200':
          description: Serviceability
          content:
            application/json:
              schema:
                type: object
                required: [pincode, serviceable, carrier]
                properties:
                  pincode: { type: string }
                  serviceable: { type: boolean }
                  carrier: { type: string, description: "delhivery, or mock-delhivery" }
                  eta_days: { type: integer }
                  cod_available: { type: boolean }
  /api/checkout:
    post:
      summary: Turn the cart into an order awaiting payment
      description: Snapshots items, prices and address into the order and empties the cart at once (so a second checkout answers 409 cart_empty rather than creating a duplicate order); creates a payment with the configured gateway (mock by default) and returns where to pay. An unpaid order can be paid later from the order page (POST /api/orders/{id}/payments).
      tags: [orders]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address_id]
              properties:
                address_id: { type: string, format: uuid }
                notify_whatsapp: { type: boolean, default: true }
                note: { type: string, maxLength: 200 }
      responses:
        '201': { description: Order created, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { description: "Cart empty (cart_empty) or an item no longer purchasable (not_printable)", $ref: '#/components/responses/Problem' }
        '422': { description: "Address not serviceable (not_serviceable)", $ref: '#/components/responses/Problem' }
  /api/orders:
    get:
      tags: [orders]
      security: [{ bearer: [] }]
      responses:
        '200': { description: Orders newest first, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } } } } }
  /api/orders/{orderId}:
    get:
      tags: [orders]
      security: [{ bearer: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/orders/{orderId}/events:
    get:
      summary: Server-Sent Events of order stage changes
      description: "event = stage, data = OrderEvent; replays after Last-Event-ID; closes after delivered or cancelled."
      tags: [orders]
      security: [{ bearer: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
  /api/orders/{orderId}/payments:
    post:
      summary: Start a new payment attempt for an order still awaiting payment
      description: Used after a failed or abandoned payment. Only while the order is pending_payment; the previous attempt is left as failed.
      tags: [payments]
      security: [{ bearer: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '201': { description: New payment, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: "Order is not awaiting payment (order_not_payable)", $ref: '#/components/responses/Problem' }
  /api/payments/{paymentId}:
    get:
      tags: [payments]
      security: [{ bearer: [] }]
      parameters: [{ name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/payments/{paymentId}/mock/complete:
    post:
      summary: Placeholder gateway page reports the outcome (mock gateway only)
      description: Enabled only when the payment's gateway is mock. Real gateways confirm through their webhook endpoints instead. Runs the same confirmation path a webhook would.
      tags: [payments]
      security: [{ bearer: [] }]
      parameters: [{ name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome: { type: string, enum: [success, failure] }
                method: { type: string, enum: [upi, card, netbanking], default: upi }
      responses:
        '200': { description: Payment after confirmation, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: "Not a mock payment or already final (payment_final)", $ref: '#/components/responses/Problem' }
  /api/share/{code}:
    get:
      summary: What the unboxing card links to
      description: Public, unauthenticated, rate-limited. The 8-character code is printed on the packaging card as /k/{code}. Answers with the piece and where to reprint or remix it; no customer data.
      tags: [share]
      security: []
      parameters: [{ name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z2-7]{8}$' } }]
      responses:
        '200':
          description: Shared piece
          content:
            application/json:
              schema:
                type: object
                required: [code, title, material_id, material_name, design_id, version_id, template_id, printed_at, studio, reprint_path, remix_path]
                properties:
                  code: { type: string }
                  title: { type: string }
                  specs_line: { type: string }
                  material_id: { type: string }
                  material_name: { type: string }
                  design_id: { type: string, format: uuid }
                  version_id: { type: string, format: uuid }
                  template_id: { type: string }
                  printed_at: { type: string, format: date }
                  studio: { type: string }
                  thumbnail_url: { type: [string, 'null'] }
                  reprint_path: { type: string, description: "Storefront path that recreates this exact piece in the cart, e.g. /design/new?version=<id>&material=<id>" }
                  remix_path: { type: string, description: "Storefront path that opens the design for editing, e.g. /design/<design_id>" }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/jobs/{jobId}/callback:
    post:
      summary: Direct-profile callback from the geometry service
      description: Not exposed publicly. Accepts a `design.progress`, `design.completed` or `design.failed` envelope.
      tags: [internal]
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/events/envelope.v1.json' }
      responses:
        '204': { description: Recorded }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    GuestHeader:
      name: X-Aakar-Guest
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Guest identity generated by the browser; ignored when a bearer token is present.
  responses:
    Problem:
      description: Problem Details
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
              code:
                type: string
                description: "Stable machine code, e.g. not_found, not_yet_available, param_out_of_range, version_not_ready, unauthenticated, otp_invalid, otp_expired, otp_rate_limited, not_printable, cart_empty, not_serviceable, payment_final"
  schemas:
    User:
      type: object
      required: [id, phone, created_at]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Session:
      type: object
      required: [access_token, token_type, expires_in_s, user, attached]
      properties:
        access_token: { type: string }
        token_type: { const: Bearer }
        expires_in_s: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        attached:
          type: object
          description: What was moved from the guest identity to the user on this sign-in.
          properties:
            designs: { type: integer }
            cart_items: { type: integer }
    AddressInput:
      type: object
      additionalProperties: false
      required: [name, phone, line1, city, state, pincode]
      properties:
        label: { type: string, maxLength: 30, description: "Home or Office" }
        name: { type: string, maxLength: 80 }
        phone: { type: string }
        line1: { type: string, maxLength: 120 }
        line2: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 60 }
        state: { type: string, maxLength: 60 }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        is_default: { type: boolean, default: false }
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    CartItem:
      type: object
      required: [id, design_id, version_id, title, material_id, qty, unit_price, line_total_paise, purchasable]
      properties:
        id: { type: string, format: uuid }
        design_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        version_no: { type: integer }
        title: { type: string }
        specs_line: { type: string, description: "e.g. Terracotta Silk · 92 × 78 × 120 mm · 55 g" }
        material_id: { type: string }
        material_name: { type: string }
        qty: { type: integer }
        unit_price: { $ref: '../schemas/price-breakdown.v1.json' }
        line_total_paise: { type: integer }
        thumbnail_url: { type: [string, 'null'] }
        purchasable: { type: boolean, description: False when the version failed printability or the template is no longer live }
        repriced: { type: boolean, description: True when the active pricing policy changed since the item was added }
    Cart:
      type: object
      required: [id, owner, items, subtotal_paise, shipping_paise, total_paise, policy_version, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner: { type: string, enum: [user, guest] }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        subtotal_paise: { type: integer }
        shipping_paise: { type: integer }
        shipping_label: { type: string }
        total_paise: { type: integer }
        policy_version: { type: string }
        updated_at: { type: string, format: date-time }
    OrderStatus:
      type: string
      description: Internal status. The customer stage is derived.
      enum: [pending_payment, confirmed, queued, slicing, printing, finishing, qc, packed, shipped, delivered, cancelled, on_hold, reprint]
    OrderStage:
      type: string
      description: Customer-facing collapsed stage (board 06).
      enum: [payment, queued, slicing, printing, sanding, shipped, delivered, cancelled]
    OrderItem:
      type: object
      required: [id, design_id, version_id, title, material_id, qty, unit_price, line_total_paise]
      properties:
        id: { type: string, format: uuid }
        design_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        version_no: { type: integer }
        title: { type: string }
        specs_line: { type: string }
        material_id: { type: string }
        material_name: { type: string }
        qty: { type: integer }
        unit_price: { $ref: '../schemas/price-breakdown.v1.json' }
        line_total_paise: { type: integer }
        assets: { type: object, additionalProperties: true, description: Snapshot of the version assets at order time }
    OrderSummary:
      type: object
      required: [id, number, status, stage, total_paise, items_count, placed_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, description: "AK-000001" }
        status: { $ref: '#/components/schemas/OrderStatus' }
        stage: { $ref: '#/components/schemas/OrderStage' }
        title: { type: string, description: First item title plus a count of the others }
        total_paise: { type: integer }
        items_count: { type: integer }
        eta: { type: [string, 'null'], format: date }
        placed_at: { type: string, format: date-time }
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [items, address, subtotal_paise, shipping_paise, payment, events]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
            address: { $ref: '#/components/schemas/Address' }
            subtotal_paise: { type: integer }
            shipping_paise: { type: integer }
            shipping_label: { type: string }
            policy_version: { type: string }
            payment: { $ref: '#/components/schemas/Payment' }
            shipment: { $ref: '#/components/schemas/Shipment' }
            events: { type: array, items: { $ref: '#/components/schemas/OrderEvent' } }
            notify_whatsapp: { type: boolean }
            note: { type: [string, 'null'] }
    OrderEvent:
      type: object
      required: [sequence, status, stage, message, at]
      properties:
        sequence: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        stage: { $ref: '#/components/schemas/OrderStage' }
        message: { type: string }
        detail: { type: object, additionalProperties: true, description: "Studio, printer bay and layer height for the tracking board" }
        at: { type: string, format: date-time }
    Payment:
      type: object
      required: [id, order_id, gateway, status, amount_paise, currency, created_at]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        gateway: { type: string, description: "mock or razorpay" }
        gateway_ref: { type: [string, 'null'], description: Provider order or payment id }
        status: { type: string, enum: [created, pending, succeeded, failed, refunded] }
        method: { type: [string, 'null'] }
        amount_paise: { type: integer }
        currency: { const: INR }
        pay_url: { type: [string, 'null'], description: Where the customer pays; the placeholder page for the mock gateway }
        invoice_number: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    Shipment:
      type: object
      required: [id, carrier, status]
      properties:
        id: { type: string, format: uuid }
        carrier: { type: string }
        awb: { type: [string, 'null'] }
        status: { type: string, enum: [created, picked_up, in_transit, out_for_delivery, delivered, returned] }
        eta: { type: [string, 'null'], format: date }
        tracking_url: { type: [string, 'null'] }
        events: { type: array, items: { type: object, properties: { status: { type: string }, message: { type: string }, at: { type: string, format: date-time } } } }
    CheckoutResult:
      type: object
      required: [order_id, order_number, payment]
      properties:
        order_id: { type: string, format: uuid }
        order_number: { type: string }
        payment: { $ref: '#/components/schemas/Payment' }
    CatalogItem:
      type: object
      required: [slug, name, category, template_id, default_params, default_material, base_price_paise, specs_line, available]
      properties:
        slug: { type: string }
        available: { type: boolean, description: "False until the item's template exists in the geometry service; the Shop shows a 'Coming soon' ribbon and POST /api/designs answers 422 template_not_available." }
        name: { type: string }
        category: { type: string, enum: [home_decor, nameplates, kitchen, desk_tech, gifting] }
        description: { type: string }
        template_id: { type: string }
        default_params: { type: object, additionalProperties: true }
        default_material: { type: string }
        base_price_paise: { type: integer }
        specs_line: { type: string, description: "e.g. 'Fits phones to 6.9″ · 92 × 78 × 120 mm · 64 g'" }
        environment: { type: string }
        media: { type: array, items: { type: object, properties: { kind: { type: string }, url: { type: string } } } }
    Material:
      type: object
      required: [id, name, filament, density_g_cm3, finish_class, rate_per_g_paise, pbr]
      properties:
        id: { type: string }
        name: { type: string }
        filament: { type: string }
        density_g_cm3: { type: number }
        finish_class: { type: string, enum: [matte, silk] }
        rate_per_g_paise: { type: integer }
        heat_safe: { type: boolean }
        pbr:
          type: object
          required: [color, roughness, metalness]
          properties:
            color: { type: string, description: sRGB hex }
            roughness: { type: number }
            metalness: { type: number }
            clearcoat: { type: number }
            clearcoat_roughness: { type: number }
            sheen: { type: number }
            sheen_color: { type: string }
    CreateDesignRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { type: string, enum: [shop, create, remix] }
        catalog_item_slug: { type: string }
        template_id: { type: string }
        params: { type: object, additionalProperties: { type: [number, integer, boolean, string] } }
        material: { type: string }
        prompt: { type: string, maxLength: 500 }
        title: { type: string, maxLength: 80 }
    DesignAccepted:
      type: object
      required: [design_id, version_no, job_id, events_url]
      properties:
        design_id: { type: string, format: uuid }
        version_no: { type: integer }
        job_id: { type: string, format: uuid }
        events_url: { type: string }
    Design:
      type: object
      required: [id, source, title, status, created_at, versions_count]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [shop, create, remix] }
        catalog_item_slug: { type: [string, 'null'] }
        title: { type: string }
        status: { type: string, enum: [generating, ready, failed] }
        created_at: { type: string, format: date-time }
        versions_count: { type: integer }
        latest_version: { $ref: '#/components/schemas/DesignVersion' }
    DesignVersion:
      type: object
      required: [id, design_id, version_no, status, spec, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        design_id: { type: string, format: uuid }
        version_no: { type: integer }
        parent_version_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [generating, ready, failed] }
        spec: { $ref: '../schemas/design-spec.v1.json' }
        template: { type: object, properties: { id: { type: string }, version: { type: integer } } }
        assets: { type: object, additionalProperties: true }
        geometry: { type: object, additionalProperties: true, description: bounds_mm, volume_cm3, surface_cm2, triangles }
        printability: { $ref: '../schemas/printability-report.v1.json' }
        print_estimate: { $ref: '../schemas/print-estimate.v1.json' }
        price: { $ref: '../schemas/price-breakdown.v1.json', description: For spec.material }
        karigar_note: { type: string }
        job_id: { type: string, format: uuid }
        created_by: { type: string, enum: [user, agent, system] }
        created_at: { type: string, format: date-time }
    Job:
      type: object
      required: [id, design_id, version_no, type, status, stage, created_at]
      properties:
        id: { type: string, format: uuid }
        design_id: { type: string, format: uuid }
        version_id: { type: [string, 'null'], format: uuid }
        version_no: { type: integer }
        type: { type: string, enum: [generate] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        stage: { type: string, enum: [queued, understanding, sculpting, checking, pricing, ready, failed] }
        message: { type: string }
        error_code: { type: [string, 'null'] }
        attempts: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    JobStageEvent:
      type: object
      required: [job_id, sequence, stage, message, at]
      properties:
        job_id: { type: string, format: uuid }
        sequence: { type: integer }
        stage: { type: string, enum: [queued, understanding, sculpting, checking, pricing, ready, failed] }
        message: { type: string }
        percent: { type: integer }
        version_id: { type: [string, 'null'], format: uuid }
        error_code: { type: [string, 'null'] }
        at: { type: string, format: date-time }
