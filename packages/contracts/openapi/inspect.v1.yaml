openapi: 3.1.0
info:
  title: Aakar Inspect Service
  version: 1.0.0-phase0
  description: |
    `services/inspect` (Python). Printability report v1 and a material-independent print estimate.
    Used in-process by the geometry service by default; this HTTP surface exists so it can be
    scaled separately later.
servers:
  - url: http://localhost:8082
paths:
  /healthz:
    get:
      responses: { '200': { description: OK } }
  /v1/inspect:
    post:
      summary: Inspect a mesh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mesh]
              properties:
                mesh:
                  type: object
                  description: Exactly one of url or path.
                  properties:
                    url: { type: string }
                    path: { type: string }
                    format: { type: string, enum: [stl, glb, 3mf, obj] }
                constraints:
                  type: object
                  properties:
                    min_wall_mm: { type: number, default: 1.2 }
                    max_overhang_deg: { type: number, default: 55 }
                    bed_mm: { type: array, items: { type: number }, minItems: 3, maxItems: 3, default: [250, 250, 250] }
                    min_tipping_margin_mm: { type: number, default: 5 }
                slicing:
                  type: object
                  properties:
                    layer_height_mm: { type: number, default: 0.2 }
                    infill_pct: { type: number, default: 15 }
                    nozzle_mm: { type: number, default: 0.4 }
                    walls: { type: integer, default: 3 }
                connector:
                  type: object
                  additionalProperties: true
                  description: |
                    Hybrid pieces: the template's connector report (kind, fit, nominal_mm, depth_mm, mouth_mm, axis, modelled
                    dims, compensation, pin_d_mm, pin_tolerance_mm, min_wall_mm, fit_tested) so the report can carry the
                    `connector_fit` check: as-printed clearance and grip against the pin's variation, wall around the
                    connector at least the material's connector_min_wall_mm, connector axis along -Z (or along the frame it
                    names) within 5°, mouth on the bed, and `warn` while no fit test has passed for the base × finish.
                  properties:
                    kind: { type: string, enum: [socket, dovetail, magnet, thread, rim_clip] }
                    nominal_mm: { type: number }
                    fit_tested: { type: boolean }
      responses:
        '200':
          description: Report and estimate
          content:
            application/json:
              schema:
                type: object
                required: [printability, print_estimate]
                properties:
                  printability: { $ref: '../schemas/printability-report.v1.json' }
                  print_estimate: { $ref: '../schemas/print-estimate.v1.json' }
        '422': { description: Mesh could not be loaded }
