name: web
on:
  pull_request:
    paths: ["apps/web/**", "apps/admin/**", "packages/design-tokens/**", "packages/contracts/openapi/*.yaml", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "apps/admin/**", "packages/design-tokens/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: |
          pnpm --filter @aakar/${{ matrix.app }} gen:api
          git diff --exit-code -- apps/${{ matrix.app }}/src/lib/api/schema.d.ts
      - run: pnpm --filter @aakar/${{ matrix.app }} typecheck
      - run: pnpm --filter @aakar/${{ matrix.app }} lint
      - run: pnpm --filter @aakar/${{ matrix.app }} build
