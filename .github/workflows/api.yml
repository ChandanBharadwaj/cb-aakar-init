name: api
on:
  pull_request:
    paths: ["services/api/**", "packages/contracts/**", "packages/design-tokens/materials.json", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["services/api/**", "packages/contracts/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: aakar, POSTGRES_PASSWORD: aakar, POSTGRES_DB: aakar_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aakar -d aakar_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AAKAR_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/aakar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: services/api
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: api-test-reports, path: services/api/build/reports/tests }
